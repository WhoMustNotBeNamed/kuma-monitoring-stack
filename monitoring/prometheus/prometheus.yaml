global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://uptime-kuma:3001/
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target  # фиксируем цель проверки (параметр для экспортера)
      - source_labels: [__param_target]
        target_label: instance  # в метриках instance = проверяемый сервис, а не exporter (для дашборда)
      - target_label: __address__
        replacement: blackbox-exporter:9115 # отправляем запрос экспортеру 
